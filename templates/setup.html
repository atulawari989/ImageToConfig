<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First-run setup — ImageToConfig</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-brand"><span class="logo">▚</span><h1>ImageToConfig</h1></div>
    <p class="auth-tag">Welcome! Create the first <b>admin</b> account to get started.
       Any existing local library &amp; history become yours.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('setup') }}" class="auth-form">
      <label>Admin username<input name="username" autofocus required></label>
      <label>Password<input name="password" type="password" required></label>
      <label>Confirm password<input name="password2" type="password" required></label>
      <button type="submit" class="primary auth-btn">Create admin &amp; continue</button>
    </form>
  </div>
</div>
</body>
</html>
